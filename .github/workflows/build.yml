name: Build TPexcel Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows Installer
        run: |
          python build_windows_installer.py

      - name: Release and Upload Installer & Portable
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "TPexcel Release ${{ github.ref_name }}"
          body: |
            ### 📦 Các tùy chọn tải về cho Windows:
            - **`TPexcel_Setup.exe`**: Bộ cài đặt Setup Wizard từng bước (tạo shortcut Desktop, Start Menu, có gỡ cài đặt).
            - **`TPexcelApp.exe`**: Tệp đơn chạy trực tiếp Portable không cần cài đặt.
            - **`TPexcelApp-Portable.zip`**: Gói nén di động chạy ngay sau khi giải nén.
          files: |
            dist/TPexcel_Setup.exe
            dist/TPexcelApp.exe
            dist/TPexcelApp-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TPexcel-Windows-Packages
          path: |
            dist/TPexcel_Setup.exe
            dist/TPexcelApp.exe
            dist/TPexcelApp-Portable.zip
